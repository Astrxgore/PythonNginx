<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PythonNginx</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #eef0f4;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101114;
      }

      main {
        width: min(560px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #2b2f36;
        border-radius: 8px;
        background: #17191e;
        box-shadow: 0 16px 48px rgb(0 0 0 / 28%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 700;
      }

      p {
        margin: 0 0 24px;
        color: #b8beca;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 6px;
        background: #3b82f6;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PythonNginx works</h1>
      <p>Сервер отдает эту страницу как статический файл. Каталог ниже покажет autoindex, если в нем нет index.html.</p>
      <a href="/files/">Открыть files</a>
    </main>
  </body>
</html>
